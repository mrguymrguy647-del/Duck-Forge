<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Duck Forge: the duck at the anvil, forging a glowing pixel.
       Made for this project, in the style of the Duck Quill icon:
       an indigo tile with stars, and the yellow duck. -->
  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="232" ry="232"/></clipPath>
    <radialGradient id="night" cx="50%" cy="34%" r="80%">
      <stop offset="0" stop-color="#7466F2"/>
      <stop offset="0.45" stop-color="#5546D0"/>
      <stop offset="1" stop-color="#1B1446"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE9A8" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#FF9E3D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF8C22" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="duck" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#FFF0A0"/>
      <stop offset="0.45" stop-color="#FFCC2E"/>
      <stop offset="1" stop-color="#E89A00"/>
    </radialGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA940"/>
      <stop offset="1" stop-color="#F0701A"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4E7FA"/>
      <stop offset="0.5" stop-color="#A9AFD6"/>
      <stop offset="1" stop-color="#6B709C"/>
    </linearGradient>
    <linearGradient id="anvil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A5F92"/>
      <stop offset="0.5" stop-color="#3A3D6B"/>
      <stop offset="1" stop-color="#1F2147"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C98548"/>
      <stop offset="1" stop-color="#8A5226"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C8"/>
      <stop offset="0.5" stop-color="#FFCC2E"/>
      <stop offset="1" stop-color="#FF8C22"/>
    </linearGradient>
    <path id="spark" d="M0,-1 C0.12,-0.3 0.3,-0.12 1,0 C0.3,0.12 0.12,0.3 0,1 C-0.12,0.3 -0.3,0.12 -1,0 C-0.3,-0.12 -0.12,-0.3 0,-1 Z"/>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#night)"/>
    <!-- stars -->
    <g fill="#DCD5FF">
      <use href="#spark" transform="translate(150,170) scale(26)" opacity="0.95"/>
      <use href="#spark" transform="translate(860,140) scale(20)" opacity="0.9"/>
      <use href="#spark" transform="translate(905,400) scale(13)" opacity="0.8"/>
      <use href="#spark" transform="translate(110,430) scale(12)" opacity="0.75"/>
      <use href="#spark" transform="translate(300,95) scale(10)" opacity="0.7"/>
      <circle cx="720" cy="90" r="5" opacity="0.7"/>
      <circle cx="210" cy="300" r="4" opacity="0.6"/>
      <circle cx="930" cy="260" r="4" opacity="0.6"/>
      <circle cx="70" cy="250" r="3.5" opacity="0.5"/>
    </g>
    <!-- the floor's glow, under the anvil -->
    <ellipse cx="512" cy="930" rx="470" ry="120" fill="#1B1446" opacity="0.55"/>
    <ellipse cx="640" cy="700" rx="330" ry="250" fill="url(#glow)"/>

    <!-- the anvil -->
    <g>
      <path d="M430,905 L850,905 L812,850 L468,850 Z" fill="url(#anvil)"/>
      <path d="M520,850 L760,850 L728,760 L552,760 Z" fill="url(#anvil)"/>
      <path d="M410,690 L905,690 C910,690 915,696 912,702 L890,742 C880,756 866,762 850,762 L470,762 C440,762 416,742 408,712 Z" fill="url(#anvil)"/>
      <!-- the horn -->
      <path d="M410,690 L250,700 C236,702 236,716 250,720 L420,750 Z" fill="url(#anvil)"/>
      <!-- the top's bright edge -->
      <path d="M252,700 L905,690 L905,704 L258,714 Z" fill="#8F95C9" opacity="0.9"/>
    </g>

    <!-- the glowing pixel on the anvil -->
    <g>
      <rect x="648" y="604" width="92" height="92" rx="6" fill="url(#ember)"/>
      <rect x="648" y="604" width="46" height="46" fill="#FFFBE0" opacity="0.55"/>
      <rect x="694" y="650" width="46" height="46" fill="#FF8C22" opacity="0.45"/>
    </g>
    <!-- sparks flying from it -->
    <g>
      <use href="#spark" transform="translate(800,540) scale(34)" fill="#FFE27A"/>
      <use href="#spark" transform="translate(880,620) scale(20)" fill="#46D6FF"/>
      <use href="#spark" transform="translate(760,470) scale(16)" fill="#46D6FF"/>
      <use href="#spark" transform="translate(600,540) scale(18)" fill="#FFE27A"/>
      <rect x="842" y="470" width="18" height="18" fill="#FFCC2E"/>
      <rect x="905" y="540" width="12" height="12" fill="#FF8C22"/>
      <rect x="560" y="470" width="12" height="12" fill="#46D6FF"/>
    </g>

    <!-- the duck -->
    <g>
      <ellipse cx="355" cy="690" rx="190" ry="26" fill="#1B1446" opacity="0.35"/>
      <!-- tail -->
      <path d="M150,520 C110,470 120,430 170,440 C190,470 205,500 235,520 Z" fill="url(#duck)"/>
      <!-- body -->
      <ellipse cx="335" cy="560" rx="205" ry="140" fill="url(#duck)"/>
      <!-- wing -->
      <path d="M250,540 C300,500 400,510 440,560 C400,610 300,620 250,585 C235,570 235,555 250,540 Z" fill="#F2A900" opacity="0.55"/>
      <!-- head -->
      <circle cx="455" cy="375" r="128" fill="url(#duck)"/>
      <!-- cheek shine -->
      <ellipse cx="410" cy="320" rx="46" ry="30" fill="#FFF7C9" opacity="0.55" transform="rotate(-28 410 320)"/>
      <!-- bill -->
      <path d="M560,372 C620,360 668,376 676,396 C668,420 620,434 566,424 C552,408 552,388 560,372 Z" fill="url(#bill)"/>
      <path d="M566,402 C610,408 646,404 674,398" stroke="#C4520F" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
      <!-- eye -->
      <circle cx="505" cy="345" r="20" fill="#1B1446"/>
      <circle cx="512" cy="338" r="7" fill="#FFFFFF"/>
    </g>

    <!-- the hammer, raised over the anvil -->
    <g transform="rotate(-24 470 470)">
      <rect x="455" y="250" width="34" height="300" rx="14" fill="url(#wood)"/>
      <rect x="395" y="205" width="205" height="92" rx="16" fill="url(#steel)"/>
      <rect x="395" y="205" width="205" height="26" rx="13" fill="#FFFFFF" opacity="0.45"/>
      <rect x="560" y="205" width="40" height="92" rx="14" fill="#565B87" opacity="0.5"/>
    </g>
    <!-- the wing holding it -->
    <path d="M395,505 C420,470 470,455 500,475 C505,500 480,530 440,545 C415,545 398,530 395,505 Z" fill="url(#duck)"/>
  </g>
</svg>

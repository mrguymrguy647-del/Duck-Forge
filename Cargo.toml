[package]
name = "duckforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "A small game engine (2D, 3D and physics), written for learning Rust"

[features]
default = ["window", "gpu"]
# Open a window to play in (with minifb). Without it, the engine builds on
# a machine with no screen and no window libraries, and games run with
# `--headless`. `--no-default-features` turns off both features.
window = ["dep:minifb"]
# Draw 3D on the graphics card with wgpu. Without it, the engine is smaller,
# compiles faster and draws everything on the CPU.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
minifb = { version = "0.28", optional = true }
gif = "0.14"
png = "0.18"
serde_json = "1"
wgpu = { version = "30", optional = true }
pollster = { version = "1", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

# Also run the tests inside these examples with `cargo test`.
[[example]]
name = "breakout"
test = true

[[example]]
name = "dodge"
test = true

[[example]]
name = "door_show_3d"
test = true

[[example]]
name = "door_short"
test = true

[[example]]
name = "duckling_parade"
test = true

[[example]]
name = "physics"
test = true

[[example]]
name = "stress3d"
test = true

[[example]]
name = "world3d"
test = true

# Optimize a little even in debug builds, so games run smoothly with a
# plain `cargo run` (the default debug build is very slow for pixel work).
[profile.dev]
opt-level = 1

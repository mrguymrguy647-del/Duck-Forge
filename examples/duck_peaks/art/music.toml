# Duck Peaks' music: a 4-second loop at 120 beats a minute, one layer per
# note (Duck Echo has no note lists, but layers start at an `offset`).
# Every note fades out before the next, so the loop ends in silence and
# repeats with no click. Then the file is made exactly 4.0 s long:
#   duck-echo render art/music.toml -o music-raw.wav --seed 1
#   python3 art/loop_fit.py music-raw.wav assets/music.wav 4.0
version = 0
name = "duck_peaks_music"
description = "A cheerful 4-second loop: square melody over a triangle bass."
tags = ["music", "loop"]

[master]
normalize = true
normalize_peak_db = -9.0
trim_silence = false

[[layers]]
name = "melody 1"
source = "square"
duty = 0.25
volume = 0.5
offset = 0.0
envelope = { attack = 0.005, hold = 0.07, decay = 0.13 }
pitch = { start = "E5" }

[[layers]]
name = "melody 2"
